name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: build and test (SDK ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The minimum supported SDK, pinned so a newer preinstalled SDK cannot mask a toolchain incompatibility.
          - { sdk: "8.0", pin: true }
          # The newest SDK (still targeting net8.0, so the .NET 8 runtime runs the tests).
          - { sdk: "10.0", pin: false }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            ${{ matrix.sdk }}.x

      - name: Pin the SDK
        if: matrix.pin
        run: |
          echo '{ "sdk": { "version": "${{ matrix.sdk }}.100", "rollForward": "latestFeature" } }' > global.json

      - name: Show the SDK
        run: dotnet --version

      - name: Restore
        run: dotnet restore StrataRec.sln

      - name: Build (warnings are errors)
        run: dotnet build StrataRec.sln -c Release --no-restore

      - name: Test
        run: dotnet test StrataRec.sln -c Release --no-build --logger "trx;LogFilePrefix=results" --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.sdk }}
          path: TestResults

  sample:
    # The same static checks a configuration change would run, plus one local request (design 10.1).
    name: validate and run the sample workspace
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build the CLI
        run: dotnet build src/StrataRec.Cli -c Release

      - name: Validate
        run: dotnet run --project src/StrataRec.Cli -c Release --no-build -- validate -c samples/home_feed

      - name: Explain the plan
        run: dotnet run --project src/StrataRec.Cli -c Release --no-build -- explain-plan -c samples/home_feed

      - name: Run a request
        run: dotnet run --project src/StrataRec.Cli -c Release --no-build -- run -c samples/home_feed -r samples/home_feed/requests/user_1001.json --trace

  benchmarks:
    # Smoke only: proves the benchmarks still build and run. Shared runners are too noisy for regression thresholds.
    name: benchmarks (dry run)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Dry run
        run: dotnet run -c Release --project tests/StrataRec.Benchmarks -- --filter '*' --job dry
